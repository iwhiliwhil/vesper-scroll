<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 390px; height: 844px; overflow: hidden; }
  body {
    font-family: 'Inter', sans-serif;
    color: #F5F3FF;
    background:
      radial-gradient(120% 50% at 50% 115%, #2B1450 0%, #1A1840 45%, transparent 75%),
      radial-gradient(80% 40% at 80% 0%, rgba(161,74,208,.14), transparent 70%),
      #0B0620;
    -webkit-font-smoothing: antialiased;
  }
  .status { display: flex; justify-content: space-between; padding: 18px 30px 0; font-size: 16px; font-weight: 600; }
  .status .r { display: flex; gap: 6px; align-items: center; }
  .status .r i { display: block; width: 25px; height: 12px; border: 1.5px solid #F5F3FF; border-radius: 4px; position: relative; }
  .status .r i::after { content: ""; position: absolute; inset: 1.5px 5px 1.5px 1.5px; background: #F5F3FF; border-radius: 1.5px; }
  .top { display: flex; justify-content: space-between; align-items: center; padding: 34px 26px 0; }
  .brand { font-size: 26px; font-weight: 300; letter-spacing: -0.04em; display: flex; align-items: center; gap: 10px; }
  .brand b { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, #8CCBFC, #A14AD0 50%, #FC6381); box-shadow: 0 0 14px 4px rgba(249,77,163,.45); }
  .dots { width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(238,240,247,.16); }
  .label { padding: 26px 26px 0; font-size: 15px; color: #A9A3C7; }
  .card {
    margin: 12px 18px 0;
    height: 350px;
    border-radius: 34px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(55% 45% at 50% 40%, rgba(238,240,247,.22), transparent 70%),
      radial-gradient(90% 55% at 50% 115%, rgba(252,99,129,.40), transparent 70%),
      linear-gradient(160deg, #2E1C66, #170B3D);
  }
  .card .silhouette {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: 210px; height: 290px;
  }
  .card .meta { position: absolute; left: 22px; bottom: 22px; }
  .card .name { font-size: 32px; font-weight: 500; letter-spacing: -0.03em; }
  .card .city { font-size: 15px; color: rgba(238,240,247,.75); margin-top: 4px; }
  .ring { position: absolute; right: 18px; top: 18px; width: 86px; height: 86px; }
  .why { padding: 22px 26px 0; }
  .why h4 { margin: 0; font-size: 15px; font-weight: 400; color: #A9A3C7; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { font-size: 15px; padding: 10px 14px; border-radius: 99px; border: 1px solid rgba(238,240,247,.16); }
  .chip.a { border-color: #F94DA3; background: rgba(249,77,163,.12); }
  .btn {
    position: absolute; left: 18px; right: 18px; bottom: 34px;
    height: 60px; border-radius: 99px;
    background: linear-gradient(90deg, #FDCBA2, #FC6381 55%, #FD67A7); color: #1B0B26;
    display: grid; place-items: center;
    font-size: 18px; font-weight: 500;
  }
</style>
</head>
<body>
  <div class="status"><span>9:41</span><span class="r"><i></i></span></div>
  <div class="top">
    <div class="brand"><b></b>Vesper</div>
    <div class="dots"></div>
  </div>
  <div class="label">Совпадение дня</div>
  <div class="card">
    <svg class="silhouette" viewBox="0 0 210 290">
      <defs>
        <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#F5F3FF" stop-opacity=".30"/>
          <stop offset="1" stop-color="#F5F3FF" stop-opacity=".04"/>
        </linearGradient>
      </defs>
      <circle cx="105" cy="92" r="56" fill="url(#s)"/>
      <path d="M10 290 C 14 200, 60 165, 105 165 C 150 165, 196 200, 200 290 Z" fill="url(#s)"/>
    </svg>
    <svg class="ring" viewBox="0 0 40 40"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8CCBFC"/><stop offset=".5" stop-color="#A14AD0"/><stop offset="1" stop-color="#FC6381"/></linearGradient></defs>
      <circle cx="20" cy="20" r="17" fill="rgba(10,15,38,.75)" stroke="rgba(238,240,247,.18)" stroke-width="2.2"/>
      <circle cx="20" cy="20" r="17" fill="none" stroke="url(#rg)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="98 107" transform="rotate(-90 20 20)"/>
      <text x="20" y="23.5" text-anchor="middle" font-size="10" font-family="Inter" font-weight="500" fill="#F5F3FF">92%</text>
    </svg>
    <div class="meta">
      <div class="name">Аня, 24</div>
      <div class="city">2 км от тебя</div>
    </div>
  </div>
  <div class="why">
    <h4>Почему вы совпали</h4>
    <div class="chips">
      <span class="chip a">Похоже смотрите на планы</span>
      <span class="chip">Дополняете друг друга</span>
      <span class="chip">Один ритм жизни</span>
    </div>
  </div>
  <div class="btn">Написать</div>
</body>
</html>
